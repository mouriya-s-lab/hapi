# Build + push the hapi hub container image on every release tag.
#
# Fork-only workflow (introduced by mouriya-s-lab/hapi#72). After
# `release.yml` publishes per-platform binary tarballs, package its
# amd64 artifact into an image with immutable and stable tags.
# The deployment-only webhook notifies the workload owner in
# homelab-apps; no Komodo API credentials are needed here (hapi#340).
#
# Runner: GARM self-hosted (resident LXD on VM 181 or edge Incus
# overflow on the operator's laptop), with labels
# `[self-hosted, linux, x64, vctcn, netbird]`. Mesh reachability comes
# from the runner host's NetBird peer. The `registry-mesh-hosts.sh`
# pre-install script pins `registry.237575.xyz → 100.85.231.90` in the
# runner instance's /etc/hosts so docker push uses the mesh path
# instead of hairpinning through OVH NAT (pve-vctcn#76).
# Runner topology: https://github.com/mouriya-s-lab/pve-vctcn/blob/main/apps/runner/README.md
#
# Secret: KEYCLOAK_REGISTRY_CLIENT_SECRET is synced from
# `pve-vctcn/apps/registry` (pve-vctcn#208).

name: publish-image

on:
    workflow_run:
        workflows: [Release]
        types: [completed]
    workflow_dispatch:
        inputs:
            tag:
                description: 'Version tag to publish (default: git ref name, must exist as a release tag)'
                required: false
                type: string

permissions:
    contents: read
    deployments: write

jobs:
    publish:
        if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
        runs-on: [self-hosted, linux, x64, vctcn, netbird]
        concurrency:
            group: hapi-delivery
            cancel-in-progress: false
            queue: max
        env:
            REGISTRY: registry.237575.xyz
            IMAGE: registry.237575.xyz/hapi/hub
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.tag || github.event.workflow_run.head_branch }}

            # Buildx driver=docker-container is required for `docker
            # buildx imagetools inspect` (Layer 4 evidence step) and gives
            # us predictable multi-tag manifest handling. `network=host`
            # inherits the runner instance's /etc/hosts override so
            # buildkit push resolves `registry.237575.xyz → mesh IP` — same trick
            # moat-browser's deploy.yml uses (pve-vctcn#76).
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
              with:
                  driver-opts: network=host

            - name: Resolve version tag
              id: version
              run: |
                  set -euo pipefail
                  if [ -n "${{ inputs.tag }}" ]; then
                      v="${{ inputs.tag }}"
                  else
                      v="${{ github.event.workflow_run.head_branch }}"
                  fi
                  echo "value=$v" >> "$GITHUB_OUTPUT"
                  echo "Publishing image tag: $v"

            # 30-min TTL Keycloak access token via the standard shared
            # composite action. Same shape runner-canary / moat-browser use.
            - name: Fetch registry access token
              id: kc
              uses: Mouriya-Emma/keycloak-token-action@v1
              with:
                  keycloak-url: https://keycloak.237575.xyz
                  realm: registry
                  client-id: registry
                  client-secret: ${{ secrets.KEYCLOAK_REGISTRY_CLIENT_SECRET }}

            - name: Login to registry.237575.xyz
              run: |
                  echo "${{ steps.kc.outputs.access-token }}" \
                      | docker login "$REGISTRY" -u sa-registry --password-stdin

            - name: Download linux/x64 release artifact
              run: |
                  set -euo pipefail
                  VERSION="${{ steps.version.outputs.value }}"
                  rm -rf .image
                  mkdir .image
                  curl -fsSL \
                      "${{ github.server_url }}/${{ github.repository }}/releases/download/${VERSION}/hapi-linux-x64-baseline.tar.gz" \
                      -o .image/hapi-linux-x64-baseline.tar.gz
                  tar -xzf .image/hapi-linux-x64-baseline.tar.gz -C .image
                  test -x .image/hapi

            # One build keeps the immutable and channel tags on the same
            # image. Push the immutable tag before moving stable, then
            # verify their digests before notifying the deployment owner.
            - name: Build (${{ steps.version.outputs.value }}, stable)
              uses: docker/build-push-action@v5
              with:
                  context: .
                  # Single-platform image: load it into the runner daemon,
                  # then use plain `docker push` below. BuildKit's registry
                  # exporter repeatedly lost its upload session through the
                  # mesh registry path after a successful build (hapi#77),
                  # while the daemon push path is the established registry
                  # transport used by the other local-CI workloads.
                  load: true
                  # amd64 only — the x64 runner label targets this platform,
                  # and homelab-tf moat-app1 (VM 110) is x86-64. An arm64
                  # image would require another platform build.
                  platforms: linux/amd64
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.version=${{ steps.version.outputs.value }}
                  tags: |
                      ${{ env.IMAGE }}:${{ steps.version.outputs.value }}
                      ${{ env.IMAGE }}:stable

            - name: Push immutable and stable tags
              run: |
                  set -euo pipefail
                  VERSION="${{ steps.version.outputs.value }}"
                  docker push "$IMAGE:$VERSION"
                  docker push "$IMAGE:stable"

            # Verify both tags share a digest via `imagetools inspect` —
            # this is Layer 4 evidence for the double-tag same-digest
            # verification criterion in the issue body.
            - name: Verify dual-tag digest equality
              run: |
                  set -euo pipefail
                  VERSION="${{ steps.version.outputs.value }}"
                  imm_digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" \
                      --format '{{.Manifest.Digest}}')
                  stable_digest=$(docker buildx imagetools inspect "$IMAGE:stable" \
                      --format '{{.Manifest.Digest}}')
                  echo "immutable tag ($VERSION): $imm_digest"
                  echo "channel   tag (stable ): $stable_digest"
                  if [ "$imm_digest" != "$stable_digest" ]; then
                      echo "::error::dual-tag digest mismatch — pipeline invariant broken" >&2
                      exit 1
                  fi
                  echo "OK — dual-tag digest match: $imm_digest"

            # Pull-back sanity check: image is reachable through the
            # end-to-end path a homelab Periphery will see when Komodo
            # deploys (docker daemon → NPM/mesh socat → registry).
            - name: Pull verification
              run: |
                  set -euo pipefail
                  VERSION="${{ steps.version.outputs.value }}"
                  docker pull "$IMAGE:$VERSION"
                  docker pull "$IMAGE:stable"
                  docker image inspect "$IMAGE:$VERSION" >/dev/null
                  docker image inspect "$IMAGE:stable" >/dev/null

            # The workload owner handles deployment asynchronously via the
            # repository's deployment-only webhook (hapi#340).
            - name: Create hapi Deployment
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  # workflow_run's github.sha is not necessarily the release
                  # commit; use the checkout that produced this image.
                  ref=$(git rev-parse HEAD)
                  jq -n --arg ref "$ref" \
                      '{ref: $ref, environment: "hapi", auto_merge: false, required_contexts: []}' \
                      | gh api --method POST "repos/${{ github.repository }}/deployments" --input -
